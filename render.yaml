services:
  - type: web
    name: clube-investimento-appo
    env: python
    plan: free
    region: frankfurt
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
# Nota: o plano "free" da Render não suporta disco persistente.
# O ficheiro appo.db é apagado sempre que o serviço reinicia ou faz novo deploy.
